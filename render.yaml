# Render Blueprint — 이 저장소를 Render 무료 웹 서비스로 한 번에 만든다.
# 사용: https://render.com/deploy?repo=https://github.com/chanmini584-ux/LOLYPOLY
# 주소: https://<name>.onrender.com (이름이 이미 쓰이면 Render가 뒤에 문자를 붙인다)
services:
  - type: web
    name: lolypoly-chanmin
    runtime: docker
    plan: free
    region: singapore          # 한국에서 가장 가까운 Render 지역
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true           # main에 푸시하면 자동 재배포
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true    # Render가 긴 무작위 값을 만들어 넣는다
      - key: DJANGO_HTTPS
        value: "True"
