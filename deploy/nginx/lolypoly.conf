# Lolypoly Nginx 설정 (Gunicorn 127.0.0.1:8000 앞단). 설치: sudo cp 이 파일 /etc/nginx/sites-available/lolypoly
#   sudo ln -s /etc/nginx/sites-available/lolypoly /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
#
# 공개 방식별 차이
# - Cloudflare Tunnel: 터널이 http://127.0.0.1:80 으로 전달. 인증서는 Cloudflare 가 처리 → 이 파일 그대로(포트 80만).
# - 직접 공개: certbot 으로 443/인증서 추가 (docs/OPERATIONS.md). 이 경우 포트 80·443만 열고 8000 은 열지 않는다.
# 앱은 .env 에서 DJANGO_HTTPS=True 로 두고, 아래 X-Forwarded-Proto 를 https 로 고정해 전달한다.
limit_req_zone $binary_remote_addr zone=lolypoly:10m rate=10r/s;

server {
    listen 80;
    server_name lolypoly.com www.lolypoly.com;

    # Cloudflare Tunnel 이 같은 PC 에서 연결하므로 실제 접속자 주소는 Cloudflare 헤더에서 받는다.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 64k;       # 의견 폼만 받는다. 파일 업로드 없음.
    server_tokens off;

    location / {
        limit_req zone=lolypoly burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
